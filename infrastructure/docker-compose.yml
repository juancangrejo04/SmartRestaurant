version: '3.8'

services:
  # ============================================================
  # 1. PostgreSQL 16 - Base de Datos Relacional Multi-Tenant
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: smartrestaurant-postgres
    restart: always
    environment:
      POSTGRES_DB: smartrestaurant_db
      POSTGRES_USER: sr_admin
      POSTGRES_PASSWORD: sr_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sr_admin -d smartrestaurant_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sr-network

  # ============================================================
  # 2. RabbitMQ 3.13 - Bus de Mensajería Asíncrona con Management
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smartrestaurant-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: sr_rabbit
      RABBITMQ_DEFAULT_PASS: sr_rabbit_pass_2026
    ports:
      - "5672:5672"    # AMQP 0-9-1 Topic Exchange
      - "15672:15672"  # Web Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - sr-network

  # ============================================================
  # 3. Auth Service (Port 4001) - Autenticación, Bcrypt, JWT, RBAC
  # ============================================================
  auth-service:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.app
    container_name: smartrestaurant-auth-service
    restart: always
    command: ["tsx", "services/auth-service/server.ts"]
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://sr_admin:sr_secure_password_2026@postgres:5432/smartrestaurant_db
      JWT_SECRET: sr_super_secret_jwt_key_dist_2026
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sr-network

  # ============================================================
  # 4. Restaurant Service (Port 4002) - Sedes, Mesas, Menús, Reseñas
  # ============================================================
  restaurant-service:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.app
    container_name: smartrestaurant-restaurant-service
    restart: always
    command: ["tsx", "services/restaurant-service/server.ts"]
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://sr_admin:sr_secure_password_2026@postgres:5432/smartrestaurant_db
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sr-network

  # ============================================================
  # 5. Reservation Service (Port 4003) - Concurrencia y Outbox
  # ============================================================
  reservation-service:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.app
    container_name: smartrestaurant-reservation-service
    restart: always
    command: ["tsx", "services/reservation-service/server.ts"]
    environment:
      PORT: 4003
      DATABASE_URL: postgresql://sr_admin:sr_secure_password_2026@postgres:5432/smartrestaurant_db
      RABBITMQ_URL: amqp://sr_rabbit:sr_rabbit_pass_2026@rabbitmq:5672
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sr-network

  # ============================================================
  # 6. Order Service (Port 4004) - Pedidos QR, Idempotencia, Outbox
  # ============================================================
  order-service:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.app
    container_name: smartrestaurant-order-service
    restart: always
    command: ["tsx", "services/order-service/server.ts"]
    environment:
      PORT: 4004
      DATABASE_URL: postgresql://sr_admin:sr_secure_password_2026@postgres:5432/smartrestaurant_db
      RABBITMQ_URL: amqp://sr_rabbit:sr_rabbit_pass_2026@rabbitmq:5672
    ports:
      - "4004:4004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sr-network

  # ============================================================
  # 7. Kitchen Service (Port 4005) - KDS y Máquina de Estados
  # ============================================================
  kitchen-service:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.app
    container_name: smartrestaurant-kitchen-service
    restart: always
    command: ["tsx", "services/kitchen-service/server.ts"]
    environment:
      PORT: 4005
      DATABASE_URL: postgresql://sr_admin:sr_secure_password_2026@postgres:5432/smartrestaurant_db
      RABBITMQ_URL: amqp://sr_rabbit:sr_rabbit_pass_2026@rabbitmq:5672
    ports:
      - "4005:4005"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sr-network

  # ============================================================
  # 8. Notification Service (Port 4006) - Consumidor de Eventos
  # ============================================================
  notification-service:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.app
    container_name: smartrestaurant-notification-service
    restart: always
    command: ["tsx", "services/notification-service/server.ts"]
    environment:
      PORT: 4006
      RABBITMQ_URL: amqp://sr_rabbit:sr_rabbit_pass_2026@rabbitmq:5672
    ports:
      - "4006:4006"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - sr-network

  # ============================================================
  # 9. Analytics Service (Port 4007) - KPIs e Informes
  # ============================================================
  analytics-service:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.app
    container_name: smartrestaurant-analytics-service
    restart: always
    command: ["tsx", "services/analytics-service/server.ts"]
    environment:
      PORT: 4007
      DATABASE_URL: postgresql://sr_admin:sr_secure_password_2026@postgres:5432/smartrestaurant_db
      RABBITMQ_URL: amqp://sr_rabbit:sr_rabbit_pass_2026@rabbitmq:5672
    ports:
      - "4007:4007"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sr-network

  # ============================================================
  # 10. API Gateway & Frontend SPA (Port 3000)
  # ============================================================
  api-gateway:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.app
    container_name: smartrestaurant-gateway
    restart: always
    command: ["tsx", "server.ts"]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://sr_admin:sr_secure_password_2026@postgres:5432/smartrestaurant_db
      RABBITMQ_URL: amqp://sr_rabbit:sr_rabbit_pass_2026@rabbitmq:5672
      JWT_SECRET: sr_super_secret_jwt_key_dist_2026
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      restaurant-service:
        condition: service_started
      reservation-service:
        condition: service_started
      order-service:
        condition: service_started
      kitchen-service:
        condition: service_started
      notification-service:
        condition: service_started
      analytics-service:
        condition: service_started
    networks:
      - sr-network

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  sr-network:
    driver: bridge
